server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lottery-server
  # 默认本地开发；云服务器用 --spring.profiles.active=prod
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# 采集任务配置（合规：低频、限流、可关闭）
lottery:
  collect:
    enabled: true
    # cron：默认每天 21:35 执行（官方开奖后留足公示时间）
    cron: "0 35 21 * * ?"
    # 单次任务内，不同彩种请求间隔（毫秒），防止高频请求
    request-interval-ms: 3000
    # HTTP 失败重试次数
    max-retry: 3
    # 重试退避基数（毫秒）
    retry-backoff-ms: 2000
    # 连接/读取超时
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    # Redis 分布式锁过期（秒），避免多实例重复采集
    lock-ttl-seconds: 600
    # 历史全量采集锁过期（秒）
    history-lock-ttl-seconds: 7200
    # 去重缓存 TTL（天）
    dedup-ttl-days: 30
    # 历史分页大小
    history-page-size: 30
    # 历史最大页数，0=不限制
    history-max-pages: 0
  # 大乐透开奖日凌晨自动生成模拟（周一/三/六 00:05）
  simulation:
    enabled: true
    cron: "0 5 0 ? * MON,WED,SAT"
    lookback-issues: 12
    candidates:
      - v2-uniform-iid
      - v3-freq-weighted-all
  # 官方公开接口（仅公示数据，请勿高频调用）
  datasource:
    cwl-base-url: https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice
    sport-base-url: https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry

# 微信小程序登录（敏感项可在各环境配置或环境变量中覆盖）
wechat:
  miniapp:
    app-id: ${WECHAT_APP_ID:wx84e99f9a4ae6011b}
    app-secret: ${WECHAT_APP_SECRET:47da044e3f3593b6c5f718eb40ecccf0}
    code2session-url: https://api.weixin.qq.com/sns/jscode2session
    # 登录态 token 有效期（天）
    token-ttl-days: 7

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
